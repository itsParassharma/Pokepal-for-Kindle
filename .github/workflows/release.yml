name: Build and publish PokePal
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pokepal-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'itsParassharma/Pokepal-for-Kindle' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_release.sh --check
      - name: Check game, saves, sprites and release protection
        run: |
          python -m pip install -r requirements-dev.txt
          python tests/test_release.py
          python tests/test_and_render.py
          python tests/test_simpleui_assets.py
      - name: Check the real KOReader runtime and SimpleUI
        run: bash tools/check_reader_runtime.sh
      - name: Download the pinned compiler
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tarfile, urllib.request
          data=json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.13.0']['x86_64-linux']
          compiler=pathlib.Path('../pokepal-compiler');compiler.mkdir(exist_ok=True)
          source=compiler/'zig.tar.xz'
          urllib.request.urlretrieve(data['tarball'],source)
          assert hashlib.sha256(source.read_bytes()).hexdigest()==data['shasum']
          with tarfile.open(source) as archive: archive.extractall(compiler,filter='data')
          PY
      - name: Check the standalone runtime
        run: |
          python tools/build_native.py --zig ../pokepal-compiler/zig-linux-x86_64-0.13.0/zig --deps ../pokepal-build-cache --headless
          cd native/build/extension
          ./pokepal-headless ../../../tests/test_native.lua native-test.pgm
      - name: Build and inspect ARM executable
        run: |
          python tools/build_native.py --zig ../pokepal-compiler/zig-linux-x86_64-0.13.0/zig --deps ../pokepal-build-cache
          file native/build/pokepal
          readelf -h native/build/pokepal | grep -q 'Machine:.*ARM'
          if readelf -l native/build/pokepal | grep -q INTERP; then exit 1; fi
          sh -n native/kual/launch.sh
      - name: Package clean downloads and corresponding source
        run: python tools/package_release.py --deps ../pokepal-build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: PokePal-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Publish the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_release.sh
