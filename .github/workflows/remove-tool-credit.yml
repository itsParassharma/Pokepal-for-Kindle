name: Remove imported tool credit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-credit:
    if: github.repository == 'itsParassharma/Pokepal-for-Kindle' && contains(github.event.head_commit.message, '[remove-tool-credit]')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the tool credit while preserving human authorship and every file
        run: |
          python - <<'PY'
          import subprocess
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          target = '1cd20b43f6d30669871b42270c3e43e1c75c7939'
          head = git('rev-parse', 'HEAD').decode().strip()
          if subprocess.run(['git', 'merge-base', '--is-ancestor', target, head]).returncode:
              raise SystemExit('The imported credit is already absent from this branch.')
          commits = [target] + git('rev-list', '--reverse', '--topo-order', '--ancestry-path', target + '..' + head).decode().split()
          mapping = {}
          for old in commits:
              header, body = git('cat-file', 'commit', old).split(b'\n\n', 1)
              if old == target:
                  credit = b'Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n'
                  assert body.count(credit) == 1
                  body = body.replace(credit, b'').rstrip() + b'\n'
              lines, skip_signature = [], False
              for line in header.splitlines():
                  if line.startswith(b'gpgsig '):
                      skip_signature = True
                      continue
                  if skip_signature and line.startswith(b' '):
                      continue
                  skip_signature = False
                  if line.startswith(b'parent '):
                      parent = line[7:].decode()
                      line = b'parent ' + mapping.get(parent, parent).encode()
                  lines.append(line)
              new = git('hash-object', '-t', 'commit', '-w', '--stdin', data=b'\n'.join(lines) + b'\n\n' + body).decode().strip()
              mapping[old] = new
              assert git('rev-parse', old + '^{tree}') == git('rev-parse', new + '^{tree}')
              assert git('show', '-s', '--format=%an <%ae>%n%cn <%ce>', old) == git('show', '-s', '--format=%an <%ae>%n%cn <%ce>', new)
              print(old, '->', new)
          subprocess.run(['git', 'push', '--force-with-lease=refs/heads/main:' + head, 'origin', mapping[head] + ':refs/heads/main'], check=True)
          PY
