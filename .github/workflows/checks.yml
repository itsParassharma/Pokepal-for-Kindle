name: Check game and layouts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/test_release.py
      - run: python tests/test_and_render.py
      - run: python tests/test_simpleui_assets.py
      - name: Check the real KOReader runtime and SimpleUI
        run: bash tools/check_reader_runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PokePal-SimpleUI-preview
          path: |
            tests/rendered/PokePal-SimpleUI-preview.zip
            tests/rendered/simpleui-*.png
