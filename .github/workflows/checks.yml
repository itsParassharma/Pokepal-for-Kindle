name: Check game and layouts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/test_and_render.py
      - run: python tests/test_simpleui_assets.py
      - name: Check the real KOReader runtime
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/koreader.tar.xz" https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-linux-x86_64-v2026.07.1.tar.xz
          echo "299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0  $RUNNER_TEMP/koreader.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/koreader"
          tar -xJf "$RUNNER_TEMP/koreader.tar.xz" -C "$RUNNER_TEMP/koreader"
          cd "$RUNNER_TEMP/koreader/lib/koreader"
          KO_HOME="$(mktemp -d)" ./luajit "$GITHUB_WORKSPACE/tests/test_koreader_runtime.lua" "$GITHUB_WORKSPACE/pokepal.koplugin"
      - name: Check upstream SimpleUI card and critter compatibility
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          git init "$RUNNER_TEMP/simpleui-source"
          git -C "$RUNNER_TEMP/simpleui-source" fetch --depth=1 https://github.com/doctorhetfield-cmd/simpleui.koplugin.git e5cd6dcb31fa759b9831223d4719f61126367cff 257c26d6685ced4fc2e895f98287b5f16f1d4f5e
          for revision in e5cd6dcb31fa759b9831223d4719f61126367cff 257c26d6685ced4fc2e895f98287b5f16f1d4f5e; do
            target="$RUNNER_TEMP/$revision.koplugin"
            mkdir "$target"
            git -C "$RUNNER_TEMP/simpleui-source" archive "$revision" | tar -x -C "$target"
            cd "$RUNNER_TEMP/koreader/lib/koreader"
            KO_HOME="$(mktemp -d)" ./luajit "$GITHUB_WORKSPACE/tests/test_simpleui_runtime.lua" "$GITHUB_WORKSPACE/pokepal.koplugin" "$target" "$GITHUB_WORKSPACE/tests/rendered/simpleui-$revision.png"
            KO_HOME="$(mktemp -d)" ./luajit "$GITHUB_WORKSPACE/tests/test_simpleui_module_runtime.lua" "$GITHUB_WORKSPACE/pokepal.koplugin" "$target" "$GITHUB_WORKSPACE/tests/rendered/simpleui-card-$revision" | tee "$RUNNER_TEMP/simpleui-card-$revision.log"
            grep -q 'SIMPLEUI MODULE RUNTIME: all checks passed' "$RUNNER_TEMP/simpleui-card-$revision.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PokePal-SimpleUI-preview
          path: |
            tests/rendered/PokePal-SimpleUI-preview.zip
            tests/rendered/simpleui-*.png
